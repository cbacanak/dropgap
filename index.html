<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0e13'/%3E%3Ccircle cx='16' cy='11' r='5' fill='%23f5f7fa'/%3E%3Cpath d='M7 19v7h18v-7' fill='none' stroke='%23c3ccd8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Dropgap</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e13; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* Dropgap — Stage 1: mechanic test.
   One round, one page. No score, no sharing, no daily mode, no session,
   no round-type pool, no risk layer. Everything else in PLAN.md is a later
   stage and is deliberately absent. */

// ---------------------------------------------------------------- World
const W = 400, H = 700;                  // logical units, scaled to fit the screen
const BALL_R = 7;
const START_Y = 24;
const RIM_Y = 600;                       // bucket rim; the result is decided when the ball centre crosses this line
const BUCKET_DEPTH = 52;
const BUCKET_MIN = 26;                   // ×10, the narrowest bucket
const BUCKET_STEPS = 10;                 // width is locked to ten geometric steps, one per multiplier
const BUCKET_STEP_RATIO = 1.22;          // each step is this much wider than the previous one (2c finding: at 1.29 the wide bucket was a free continue)
const BUCKET_MAX = BUCKET_MIN * Math.pow(BUCKET_STEP_RATIO, BUCKET_STEPS - 1);   // ×1, the widest; nothing wider (≈156 at 1.22)
const BUCKET_START_STEP = 6;             // ×4
function stepWidth(k) { return BUCKET_MIN * Math.pow(BUCKET_STEP_RATIO, k); }
// The widest step still on the ladder: ×1 normally; in endless the ladder can raise the floor (§2e.1).
function maxStepIndex() { return BUCKET_STEPS - (game.rules ? game.rules.minMult : 1); }
function maxBucketWidth() { return stepWidth(maxStepIndex()); }
function nearestStep(w) { return clamp(Math.round(Math.log(w / BUCKET_MIN) / Math.log(BUCKET_STEP_RATIO)), 0, maxStepIndex()); }
// The gesture: touch anywhere and drag. Movement is relative to where the finger landed (the
// bucket never jumps to it): sideways moves the bucket, up narrows it, down widens it, both at
// once. No handles. Letting go drops the ball once the finger has left the dead zone at least
// once; a touch that never moved drops only in the bottom half, and does nothing in the top half,
// so a stray touch while looking at the platforms cannot end the round (PLAN §7.1).
const TAP_DROP_Y = H * 0.5;              // a still touch at or below this line drops with the bucket as it is
const DRAG_WIDTH_GAIN = 1.6;             // width units per vertical unit
const DRAG_DEADZONE = 6;                 // wobble below this, on either axis, changes nothing

// -------------------------------------------------------------- Physics
// Fixed. The physics has to stay learnable (PLAN §0): nothing here varies per round.
const GRAVITY = 1500;
const DT = 1 / 240;
const PLATFORM = { rest: 0.60, fric: 0.75 };
const WALL     = { rest: 0.60, fric: 0.98 };
const FLOOR    = { rest: 0.35, fric: 0.85 };
const BUCKET   = { rest: 0.40, fric: 0.85 };
const ROLL_FRICTION = 0.985;             // per step while resting on a surface
const REST_SPEED = 25;                   // a bounce slower than this dies

// ------------------------------------------------- Level generation bounds
// Solvable, not chaotic: angles, hit points and landing spots stay well inside these ranges.
const BANDS = [[150, 190], [305, 345], [450, 495]];   // platform centre y, per platform (the session's three)
// Bands for n platforms. Three is the session's fixed layout and must not move; the other counts
// spread evenly over the same vertical range, with tighter jitter when crowded.
function bandsFor(n) {
  if (n === 3) return BANDS;
  const top = 170, bottom = 472, half = n >= 5 ? 15 : 20;
  return Array.from({ length: n }, (_, i) => { const c = top + (bottom - top) * i / (n - 1); return [c - half, c + half]; });
}
const PLAT_LEN = [80, 120];
const PLAT_ANGLE = [6, 18];              // degrees (magnitude); sign is random, then repaired away from walls
// The first bounce has to carry information (PLAN §2e.4): the ball drops anywhere across the
// width, and the first platform ranges from nearly flat to steeper than the rest, so the first
// bounce goes left, right, or nearly straight up. A tilt toward a wall is repaired as before.
const DROP_X = [40, W - 40];              // the ball's drop x, spread over the whole width
const FIRST_ANGLE = [5, 22];             // the first platform's tilt when it leans (magnitude); the others keep PLAT_ANGLE
// One first platform in five is nearly flat: the ball goes almost straight up. It is aimed near
// the downhill end so it clears the platform on the way down (still the downhill half).
const FLAT_FIRST = { share: 0.2, angle: [3, 5], hitU: [0.12, 0.2] };   // exit ≈ 2.4× the tilt: 7–12° from vertical
const HIT_U = [0.2, 0.45];               // aim point along the platform, measured from the downhill end (uphill hits skip)
const HIT_U_OK = [0.10, 0.90];           // accepted contact range after simulation (no edge clips)
const LANDING_X = [40, W - 40];
const MAX_FLIGHT_T = 4.5;
const MAX_ATTEMPTS = 400;

// --------------------------------------------------------------- Timing
// ---------------------------------------------------- Difficulty (Stage 2b)
// Less information each round, never different physics. One row per round; tune here.
//   seenAfterBounce  ball stays fully visible this long after the first bounce, then fades over FADE_T
//   hold             beat before the ball is let go (the round has no countdown after the decision)
//   platformAlpha    how strongly the platforms are drawn; never hidden, they are what the player reads
const DIFFICULTY = [
  { seenAfterBounce: 0.22, hold: 0.55, platformAlpha: 1.00 },   // round 1: the Stage 1 values
  { seenAfterBounce: 0.18, hold: 0.50, platformAlpha: 0.90 },
  { seenAfterBounce: 0.14, hold: 0.45, platformAlpha: 0.80 },
  { seenAfterBounce: 0.10, hold: 0.40, platformAlpha: 0.70 },
  { seenAfterBounce: 0.06, hold: 0.35, platformAlpha: 0.60 },   // round 5: the first bounce itself is still fully visible
];
// Level generation must not depend on the round, so it works with the longest visible time:
// the second bounce stays unseen at every difficulty.
const SEEN_AFTER_BOUNCE_MAX = Math.max(...DIFFICULTY.map(d => d.seenAfterBounce));
const FADE_T = 0.28;
const SLOWMO_WINDOW = 0.5, SLOWMO_MIN = 0.5;   // last half second before the rim runs at half speed
const RING_T = 0.7;

// ------------------------------------------- Session and modes (Stages 2a, 2c, 2e)
const SESSION_ROUNDS = 5;
const EDGE_SCORE = 0.5;                  // an edge catch scores this fraction of the multiplier, rounded up
// Two modes, no menu. The daily five-round session is the default. Endless (?mode=endless) is an
// open run: no round limit; a miss sends the run back to the start of its ladder band (the band
// checkpoint, PLAN §2e.3), the score is the highest total reached, the run ends when the player leaves.
// The "take ×N · finish" target went unused in three tests (2c, 2e, 2e with a best score) and is
// switched off in both modes: the bucket width already asks the same question. The code stays.
// Difficulty in endless: the last DIFFICULTY row holds from round 6 on, deliberately, so a ceiling
// in a long run is observed at constant difficulty.
const MODES = {
  session: { rounds: SESSION_ROUNDS, bank: false },
  endless: { rounds: Infinity, bank: false },
};
const STRIP_SLOTS = 5;                   // the strip shows the last five rounds; older ones slide off to the left

// ------------------------------------------- Endless platform style (the ceiling lever)
// ------------------------------------------- Endless ladder (PLAN §2e.1)
// Endless only. One row per round band, five columns; each row changes one column from the row
// before it, so the player notices that something changed but never asks "what happened".
//   platforms  how many platforms the ball bounces off (the generator places 2–5)
//   fade       where the ball fades out, from the round's geometry, never from a clock:
//              'nearNext' gone just before the second platform, 'half' from halfway along the
//              path between the first bounce and the second platform, 'after' right after the
//              first bounce (the session's value)
//   minMult    the lowest bucket step still on the ladder; the steps below it are gone
//   alpha      how strongly the platforms are drawn
//   draw       'bar', or 'dots' (endpoints only: they never disappear, the angle can always be read)
// The first bounce is fully visible in every row. Physics and the generator's rules do not change;
// the platform count is part of the round, so endless seeds differ from before this ladder.
const ENDLESS_LADDER = [
  { from: 1,  platforms: 2, fade: 'nearNext', minMult: 1, alpha: 1.00, draw: 'bar' },
  { from: 4,  platforms: 3, fade: 'nearNext', minMult: 1, alpha: 1.00, draw: 'bar' },
  { from: 7,  platforms: 3, fade: 'half',     minMult: 1, alpha: 1.00, draw: 'bar' },
  { from: 10, platforms: 4, fade: 'half',     minMult: 1, alpha: 1.00, draw: 'bar' },
  { from: 13, platforms: 4, fade: 'half',     minMult: 2, alpha: 1.00, draw: 'bar' },
  { from: 16, platforms: 4, fade: 'half',     minMult: 2, alpha: 0.65, draw: 'bar' },
  { from: 19, platforms: 4, fade: 'after',    minMult: 2, alpha: 0.65, draw: 'bar' },
  { from: 22, platforms: 5, fade: 'after',    minMult: 2, alpha: 0.65, draw: 'bar' },
  { from: 25, platforms: 5, fade: 'after',    minMult: 3, alpha: 0.65, draw: 'bar' },
  { from: 28, platforms: 5, fade: 'after',    minMult: 3, alpha: 0.45, draw: 'bar' },
  { from: 31, platforms: 5, fade: 'after',    minMult: 3, alpha: 1.00, draw: 'dots' },   // as written in the plan: alpha and draw both change here
];
function ladderRow(round) { let row = ENDLESS_LADDER[0]; for (const r of ENDLESS_LADDER) if (round >= r.from) row = r; return row; }
// The rules for a round: the ladder row in endless; the session's fixed shape otherwise.
function rulesFor(mode, index, diff) {
  if (mode === 'endless') return ladderRow(index + 1);
  return { platforms: 3, fade: 'after', minMult: 1, alpha: diff.platformAlpha, draw: 'bar' };
}
// Where the ball fades out, from the round's geometry; never earlier than the first bounce itself.
function fadeStartFor(sim, fade, seenAfterBounce) {
  const t1 = sim.events[0].t, t2 = sim.events[1].t;
  const t = fade === 'nearNext' ? t2 - FADE_T - 0.04 : fade === 'half' ? halfwayT(sim, t1, t2) : t1 + seenAfterBounce;
  return Math.max(t, t1 + 0.06);
}
function halfwayT(sim, t0, t1) {   // the time at which the ball has covered half the path length between t0 and t1
  const i0 = Math.round(t0 / DT), i1 = Math.round(t1 / DT);
  const seg = i => Math.hypot(sim.xs[i] - sim.xs[i - 1], sim.ys[i] - sim.ys[i - 1]);
  let total = 0;
  for (let i = i0 + 1; i <= i1; i++) total += seg(i);
  let acc = 0;
  for (let i = i0 + 1; i <= i1; i++) { acc += seg(i); if (acc >= total / 2) return i * DT; }
  return (t0 + t1) / 2;
}
// Endless keeps one number on this device: the best total ever reached. Shown in the header during
// a run. Just the number; no advice, no warnings.
const BEST_KEY = 'dropgap.endless.best';
function loadBest() { try { return Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0); } catch (e) { return 0; } }
function saveBest(n) { try { localStorage.setItem(BEST_KEY, String(n)); } catch (e) { /* private mode, blocked storage */ } }
const HEADER_H = 68;                     // band above the play field: seed, round, total, and the strip of finished rounds (doubled, PLAN §7.1)
const STRIP_SLOT = 46, STRIP_GAP = 6, STRIP_H = 14;  // five slots; a bar at BUCKET_MAX fills a slot

// --------------------------------------------------------------- Colours
// Colour is used for exactly one job: telling the three outcomes apart (PLAN §7).
const C = {
  outside: '#0b0e13', panel: '#11151c', line: '#232a36',
  platform: '#aab4c3', ball: '#f5f7fa', bucket: '#c3ccd8', handle: '#e6ebf2',
  text: '#e6ebf2', dim: '#6b7684', faint: '#3d4654',
  center: '#58d68d', edge: '#f0c060', miss: '#e06c5c',
};
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

// ----------------------------------------------------------------- Utils
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }

// mulberry32: small and deterministic. Same seed → same round, on every device.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------ Simulation
function bucketSegments(b) {
  const bottom = RIM_Y + BUCKET_DEPTH;
  const s = (x1, y1, x2, y2, index) => ({ x1, y1, x2, y2, kind: 'bucket', index, rest: BUCKET.rest, fric: BUCKET.fric });
  return [s(b.left, RIM_Y, b.left, bottom, 0), s(b.left, bottom, b.right, bottom, 1), s(b.right, bottom, b.right, RIM_Y, 2)];
}

// Runs the ball from the drop point with a fixed step and no randomness:
// the same level and bucket always produce the same path.
function simulate(level, bucket, opts) {
  opts = opts || {};
  const maxT = opts.maxT || 8;
  const segs = level.platforms.map((p, i) => ({ x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2, kind: 'platform', index: i, rest: PLATFORM.rest, fric: PLATFORM.fric }));
  if (bucket) segs.push(...bucketSegments(bucket));
  const touching = new Array(segs.length).fill(false);
  let touchingWall = false;

  let x = level.x0, y = START_Y, vx = 0, vy = 0, t = 0;
  const xs = [x], ys = [y], events = [];
  let crossed = false, crossT = null, crossX = null, nearT = null;
  let reachedY = false, xAtY = null, restTime = 0;

  for (let step = 1; t < maxT; step++) {
    const px = x, py = y;
    vy += GRAVITY * DT;
    x += vx * DT; y += vy * DT;
    t = step * DT;
    let resting = false;

    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
      let u = ((x - s.x1) * dx + (y - s.y1) * dy) / (dx * dx + dy * dy);
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const cx = s.x1 + u * dx, cy = s.y1 + u * dy;
      let nx = x - cx, ny = y - cy;
      const d = Math.sqrt(nx * nx + ny * ny);
      if (d >= BALL_R || d === 0) { touching[i] = false; continue; }
      nx /= d; ny /= d;
      x += nx * (BALL_R - d); y += ny * (BALL_R - d);
      const vn = vx * nx + vy * ny;
      let bounced = false;
      if (vn < 0) {
        const tx = vx - vn * nx, ty = vy - vn * ny;
        const out = -vn * s.rest;
        if (out < REST_SPEED) { resting = true; vx = tx * ROLL_FRICTION; vy = ty * ROLL_FRICTION; }
        else { bounced = true; vx = tx * s.fric + nx * out; vy = ty * s.fric + ny * out; }
      }
      if (!touching[i]) events.push({ t, kind: s.kind, index: s.index, u, nx, ny, x: x - nx * BALL_R, y: y - ny * BALL_R, bounced });
      touching[i] = true;
    }

    let wall = false;
    if (x < BALL_R) { x = BALL_R; wall = true; if (vx < 0) { vx = -vx * WALL.rest; vy *= WALL.fric; } }
    else if (x > W - BALL_R) { x = W - BALL_R; wall = true; if (vx > 0) { vx = -vx * WALL.rest; vy *= WALL.fric; } }
    if (wall && !touchingWall) events.push({ t, kind: 'wall', x, y });
    touchingWall = wall;

    if (y > H - BALL_R) {
      y = H - BALL_R;
      if (vy > 0) {
        const out = vy * FLOOR.rest;
        if (out < REST_SPEED) { vy = 0; resting = true; vx *= ROLL_FRICTION; }
        else { vy = -out; vx *= FLOOR.fric; }
      }
    }

    xs.push(x); ys.push(y);
    if (!crossed && py < RIM_Y && y >= RIM_Y) {
      crossed = true; crossT = t;
      crossX = px + (x - px) * ((RIM_Y - py) / (y - py));
    }
    if (nearT === null && y >= RIM_Y - BALL_R) nearT = t;
    if (opts.untilY != null && y >= opts.untilY) { reachedY = true; xAtY = x; break; }
    if (opts.stopAtRim && crossed) break;
    if (resting && vx * vx + vy * vy < 15 * 15) { restTime += DT; if (restTime > 0.3) break; }
    else restTime = 0;
    if (crossed && opts.afterCross != null && t - crossT > opts.afterCross) break;
  }
  return { xs, ys, events, crossed, crossT, crossX, nearT, reachedY, xAtY, endT: t };
}

function posAt(sim, t) {
  const f = t / DT, n = sim.xs.length - 1;
  const i = Math.floor(f);
  if (i < 0) return { x: sim.xs[0], y: sim.ys[0] };
  if (i >= n) return { x: sim.xs[n], y: sim.ys[n] };
  const k = f - i;
  return { x: sim.xs[i] + (sim.xs[i + 1] - sim.xs[i]) * k, y: sim.ys[i] + (sim.ys[i + 1] - sim.ys[i]) * k };
}

// ------------------------------------------------------ Level generation
// Each platform is placed on the ball's actual path (found by simulating the platforms
// placed so far), so every round has exactly n bounces (n = 2–5), in order, on the top face,
// away from the platform ends, with no wall contact — then the whole thing is verified.
// deg > 0 tilts the platform down to the right (the ball is sent right); u is measured
// from the downhill end, because a ball landing on the uphill half skips down the slope.
function makePlatform(xh, cy, len, deg, u) {
  const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const half = len / 2 * ca;
  const uLeft = deg > 0 ? 1 - u : u;
  const cx = clamp(xh - (uLeft - 0.5) * len * ca, 14 + half, W - 14 - half);
  return { x1: cx - half, y1: cy - len / 2 * sa, x2: cx + half, y2: cy + len / 2 * sa };
}

// Does the path stay clean after platform i? Before the last one: reach the next band with
// no wall contact and a single bounce on the new platform. After the last one: the full check.
function probeAfter(x0, platforms, i, n, bands) {
  if (i < n - 1) {
    const nextY = (bands[i + 1][0] + bands[i + 1][1]) / 2;
    const p = simulate({ x0, platforms }, null, { untilY: nextY, maxT: MAX_FLIGHT_T });
    if (!p.reachedY) return null;
    if (p.events.some(e => e.kind !== 'platform') || p.events.filter(e => e.index === i).length !== 1) return null;
    return {};
  }
  const base = simulate({ x0, platforms }, null, { stopAtRim: true, maxT: MAX_FLIGHT_T + 0.5 });
  return validate(base, n) ? { base } : null;
}

function tryGenerate(rnd, n) {
  const x0 = lerp(DROP_X[0], DROP_X[1], rnd());
  const bands = bandsFor(n), platforms = [];
  let base = null;
  for (let i = 0; i < n; i++) {
    const cy = lerp(bands[i][0], bands[i][1], rnd());
    const len = lerp(PLAT_LEN[0], PLAT_LEN[1], rnd());
    const flat = i === 0 && rnd() < FLAT_FIRST.share;
    const angle = flat ? FLAT_FIRST.angle : i === 0 ? FIRST_ANGLE : PLAT_ANGLE;
    const mag = lerp(angle[0], angle[1], rnd());
    const hitU = flat ? FLAT_FIRST.hitU : HIT_U;
    const u = lerp(hitU[0], hitU[1], rnd());
    const sign = rnd() < 0.5 ? -1 : 1;
    let xh = x0;
    if (i > 0) {
      const probe = simulate({ x0, platforms }, null, { untilY: cy, maxT: MAX_FLIGHT_T });
      if (!probe.reachedY) return null;
      xh = probe.xAtY;
    }
    // Repair rather than reject: keep the drawn tilt if the ball stays clear of the walls,
    // otherwise flip it, then soften it. No randomness here, so the seed still fixes the round.
    let placed = null;
    for (const [s, m] of [[sign, mag], [-sign, mag], [sign, mag * 0.6], [-sign, mag * 0.6]]) {
      const p = makePlatform(xh, cy, len, s * m, u);
      const r = probeAfter(x0, platforms.concat(p), i, n, bands);
      if (r) { placed = p; base = r.base || null; break; }
    }
    if (!placed) return null;
    platforms.push(placed);
  }
  return { x0, platforms, base };
}

function validate(sim, n) {
  if (!sim.crossed || sim.crossT > MAX_FLIGHT_T) return false;
  if (sim.crossX < LANDING_X[0] || sim.crossX > LANDING_X[1]) return false;
  const ev = sim.events;
  if (ev.length !== n) return false;
  for (let i = 0; i < n; i++) {
    const e = ev[i];
    if (e.kind !== 'platform' || e.index !== i || !e.bounced) return false;
    if (e.u < HIT_U_OK[0] || e.u > HIT_U_OK[1] || e.ny > -0.5) return false;
  }
  if (ev[0].t < 0.3) return false;                                    // a visible drop before the first bounce
  if (ev[1].t - ev[0].t < SEEN_AFTER_BOUNCE_MAX + FADE_T + 0.1) return false; // the second bounce stays unseen
  return true;
}

function generateLevel(seed, n) {
  n = n || 3;
  const rnd = mulberry32(seed);
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    const lvl = tryGenerate(rnd, n);
    if (lvl) { lvl.seed = seed; lvl.attempts = attempt; lvl.platformCount = n; return lvl; }
  }
  return generateLevel((seed + 1) >>> 0, n); // practically unreachable; keeps the page alive
}

// ------------------------------------------------------------------ Game
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = { scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };

const game = {
  mode: 'session',           // 'session' | 'endless' (see MODES)
  best: 0, newBest: false,   // endless only: best banked total on this device, and whether this run set it
  session: null,             // { seed, index, rounds: [{ mult, width, result, score }], total, reached, resume, outcome, endedAt, attempts }
                             // attempts: endless only, how many times each round index has been started
                             // reached: highest total so far; resume: round index the next tap starts after a checkpoint
                             // outcome: null while playing, then 'banked' | 'bust' | 'complete'; endedAt: rounds played
  roundSeed: 0, roundsPlayed: 0, level: null, diff: null, rules: null, stepGone: null,
  state: 'observe',          // observe → reveal → result, round after round, then summary
  clock: 0,                  // seconds since the round started
  summaryAge: 0, totalAge: 9, stripShiftAge: 9,
  firstBounce: null, fadeStartT: 0, flashedFirst: false,
  bucket: { left: 0, right: 0 },
  drag: null, reveal: null, flashes: [], rings: [],
  modeWord: { x0: 0, x1: 0 },   // where the header's mode word was drawn this frame, for the tap
};

function readSeed() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  if (m) return parseInt(m[1], 10) >>> 0;
  return (Math.random() * 0x7fffffff) >>> 0;
}
function readMode() { return /[?&]mode=endless(?:&|$)/.test(location.search) ? 'endless' : 'session'; }
function writeSeed(seed) {
  try { history.replaceState(null, '', '?seed=' + seed + (game.mode === 'endless' ? '&mode=endless' : '')); } catch (e) { /* file:// */ }
}
function modeCfg() { return MODES[game.mode]; }
function roundLimit() { return modeCfg().rounds; }
// The only way between modes: the small word in the header, next to the seed, in both modes.
function switchMode() {
  game.mode = game.mode === 'endless' ? 'session' : 'endless';
  startSession(game.session.seed);
}

// One session seed fixes all five rounds: ?seed=N always gives the same five, in the same order.
// In endless the round seed also carries how many times that round has been started (the band
// checkpoint replays rounds): the first attempt is the plain seed, so a URL seed stays
// reproducible, and a replayed round never comes back with the same trajectory to memorise.
function roundSeed(sessionSeed, i, attempt = 0) {
  let x = (sessionSeed + Math.imul(i + 1, 0x9E3779B9) + Math.imul(attempt, 0x85EBCA77)) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35) >>> 0;
  return (x ^ (x >>> 16)) >>> 0;
}

function startSession(seed) {
  game.session = { seed, index: 0, rounds: [], total: 0, reached: 0, resume: null, outcome: null, endedAt: 0, attempts: {} };
  game.totalAge = 9; game.stripShiftAge = 9; game.newBest = false;
  writeSeed(seed);
  startRound(0);
}

function startRound(i) {
  game.session.index = i; game.roundsPlayed++;
  if (i >= STRIP_SLOTS) game.stripShiftAge = 0;                  // the strip slides one slot to the left
  const s = game.session;
  const attempt = game.mode === 'endless' ? (s.attempts[i] = (s.attempts[i] || 0) + 1) - 1 : 0;   // session: always the plain seed
  game.roundSeed = roundSeed(s.seed, i, attempt);
  game.diff = DIFFICULTY[Math.min(i, DIFFICULTY.length - 1)];
  const prev = game.rules;
  game.rules = rulesFor(game.mode, i, game.diff);
  game.level = generateLevel(game.roundSeed, game.rules.platforms);
  game.state = 'observe'; game.clock = 0;
  game.firstBounce = game.level.base.events[0];
  game.fadeStartT = fadeStartFor(game.level.base, game.rules.fade, game.diff.seenAfterBounce);
  game.flashedFirst = false;
  game.drag = null; game.reveal = null; game.flashes = []; game.rings = [];
  // A step leaving the ladder is shown, not silent: the old widest bucket collapses into the new one.
  game.stepGone = i > 0 && prev && game.rules.minMult > prev.minMult
    ? { from: stepWidth(BUCKET_STEPS - prev.minMult), to: maxBucketWidth(), mult: prev.minMult, age: 0 } : null;
  game.bucket.left = W / 2 - stepWidth(BUCKET_START_STEP) / 2;
  game.bucket.right = W / 2 + stepWidth(BUCKET_START_STEP) / 2;
}

function bucketWidth() { return game.bucket.right - game.bucket.left; }
function bucketCx() { return (game.bucket.left + game.bucket.right) / 2; }
function multiplier() { return BUCKET_STEPS - nearestStep(bucketWidth()); }

// Dragging stays smooth; on release the width settles on the nearest step, around the centre.
function snapBucket() {
  const b = game.bucket, target = stepWidth(nearestStep(bucketWidth())), cx = bucketCx();
  b.left = cx - target / 2; b.right = cx + target / 2;
  const shift = Math.max(0, 2 - b.left) - Math.max(0, b.right - (W - 2));
  b.left += shift; b.right += shift;
}
function observeT() { return Math.max(0, game.clock - game.diff.hold); }

function classify(sim) {
  if (!sim.crossed) return 'miss';
  const dx = Math.abs(sim.crossX - bucketCx()), w = bucketWidth();
  if (dx <= w / 4) return 'center';
  if (dx <= w / 2) return 'edge';
  return 'miss';
}

// The finger came off: the decision is made, the simulation plays out (PLAN §8.3).
function commit() {
  if (game.state !== 'observe') return;
  const startT = Math.min(observeT(), game.fadeStartT);
  const sim = simulate(game.level, game.bucket, { maxT: 10, afterCross: 3 });
  const result = classify(sim);
  const targetT = sim.nearT != null ? sim.nearT : sim.endT;
  const resultT = sim.crossed ? sim.crossT : Math.min(sim.endT, targetT + 0.5);
  const mult = multiplier();
  game.reveal = { sim, startT, simT: startT, prevT: startT, targetT, resultT, result, shown: false, age: 0, mult, width: bucketWidth(), score: scoreFor(result, mult) };
  game.state = 'reveal';
}

// Graded scoring (PLAN §0): dead centre earns the multiplier, the edge earns part of it, a miss nothing.
function scoreFor(result, mult) {
  if (result === 'center') return mult;
  if (result === 'edge') return Math.ceil(mult * EDGE_SCORE);
  return 0;
}

// After a round there are two ways out (Stage 2c): tap anywhere for the next round, or take the
// total and finish (the pill at the bottom). Continue and miss, and the total is gone and the
// session is over. The fifth round takes the total by itself; there is no choice there.
// Nothing here weighs the choice for the player.
function openSummary() {
  const s = game.session;
  s.endedAt = s.rounds.length;
  game.state = 'summary'; game.summaryAge = 0; game.drag = null;
}
function bankAvailable() {
  const s = game.session;
  return modeCfg().bank && game.state !== 'summary' && canAdvance() && !s.outcome && s.index + 1 < roundLimit();
}
function bank() {
  if (!bankAvailable()) return;
  game.session.outcome = 'banked';
  if (game.mode === 'endless' && game.session.total > game.best) { game.best = game.session.total; game.newBest = true; saveBest(game.best); }
  openSummary();
}
function bankPill() { const w = 156, h = 26; return { x: W - 12 - w, y: H - 12 - h, w, h }; }
function bankLabel() { return `take ×${game.session.total} · ${game.best > 0 ? 'best ' + game.best : 'finish'}`; }
// Endless (PLAN §2e.3): a miss does not end the run, it sends it back to the first round of its
// ladder band. The rounds played since then and their points are gone; the highest total reached,
// and the best, stay. The counter and the strip show the band start from the miss moment on.
function checkpoint() {
  const s = game.session, from = ladderRow(s.index + 1).from - 1;   // index of the band's first round
  s.rounds.length = from;
  s.total = s.rounds.reduce((t, rd) => t + rd.score, 0);
  s.index = from;
  s.resume = from;
}
function advance() {
  const s = game.session;
  if (game.state === 'summary') { startSession((s.seed + 1) >>> 0); return; }
  if (s.resume != null) { const i = s.resume; s.resume = null; startRound(i); return; }   // back at the band start
  if (s.outcome) { openSummary(); return; }                       // the miss already ended the session
  if (s.index + 1 < roundLimit()) startRound(s.index + 1);
  else { s.outcome = 'complete'; openSummary(); }
}

function timeScale(t, target) {
  const a = target - SLOWMO_WINDOW;
  if (t < a) return 1;
  if (t < target) return 1 - (1 - SLOWMO_MIN) * smooth((t - a) / SLOWMO_WINDOW);
  return SLOWMO_MIN + (1 - SLOWMO_MIN) * smooth((t - target) / 0.35);
}

function addFlash(x, y) { game.flashes.push({ x, y, age: 0 }); }

function update(dt) {
  for (const f of game.flashes) f.age += dt;
  game.flashes = game.flashes.filter(f => f.age < 0.3);
  for (const r of game.rings) r.age += dt;
  game.rings = game.rings.filter(r => r.age < RING_T);
  game.totalAge += dt; game.stripShiftAge += dt;
  if (game.stepGone) game.stepGone.age += dt;
  if (game.state === 'summary') { game.summaryAge += dt; return; }

  if (game.state === 'observe') {
    game.clock += dt;
    // The simulation keeps running in the background; only the drawing stops after the fade.
    if (!game.flashedFirst && observeT() >= game.firstBounce.t) {
      game.flashedFirst = true;
      addFlash(game.firstBounce.x, game.firstBounce.y);
    }
    return;
  }

  const r = game.reveal, sim = r.sim;
  if (game.state === 'reveal') {
    r.prevT = r.simT;
    r.simT = Math.min(sim.endT, r.simT + dt * timeScale(r.simT, r.targetT));
    for (const e of sim.events) {
      if (e.kind === 'platform' && e.bounced && e.t > r.prevT && e.t <= r.simT && e.t >= r.startT) addFlash(e.x, e.y);
    }
    if (!r.shown && r.simT >= r.resultT) {
      r.shown = true; r.age = 0;
      if (r.result !== 'miss') game.rings.push({ x: sim.crossX, y: RIM_Y, kind: r.result, age: 0 });
      const s = game.session;                                       // the round lands in the session at the result moment
      s.rounds.push({ mult: r.mult, width: r.width, result: r.result, score: r.score });
      if (r.result === 'miss' && game.mode === 'endless') {         // endless: back to the start of the band
        checkpoint();
      } else if (r.result === 'miss') {                             // session: the total is gone and the session is over
        s.outcome = 'bust'; s.total = 0;
        game.totalAge = 0;
      } else {
        s.total += r.score;
        s.reached = Math.max(s.reached, s.total);
        if (game.mode === 'endless' && s.total > game.best) { game.best = s.total; game.newBest = true; saveBest(game.best); }
        game.totalAge = 0;
      }
    }
    if (r.shown) r.age += dt;
    if (r.shown && r.simT >= sim.endT) game.state = 'result';
  } else if (game.state === 'result') {
    r.age += dt;
  }
}

// ----------------------------------------------------------------- Input
// Pointer events only: mouse, touch and pen share this one code path (PLAN §5.1).
function toWorld(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left - view.ox) / view.scale, y: (e.clientY - rect.top - view.oy) / view.scale - HEADER_H };
}

function tapDrops(y) { return y >= TAP_DROP_Y; }
function pastDeadzone(v) { return Math.abs(v) <= DRAG_DEADZONE ? 0 : v - Math.sign(v) * DRAG_DEADZONE; }

// Relative to where the finger landed: sideways = position, up = narrower, down = wider.
function applyDrag(p) {
  const b = game.bucket, d = game.drag;
  const dy = pastDeadzone(d.startY - p.y), dx = pastDeadzone(p.x - d.startX);
  if (dx !== 0 || dy !== 0) d.moved = true;                       // past the dead zone at least once: letting go will drop
  const w = clamp(d.startW - dy * DRAG_WIDTH_GAIN, BUCKET_MIN, maxBucketWidth());
  const cx = clamp(d.startCx + dx, w / 2 + 2, W - w / 2 - 2);
  b.left = cx - w / 2; b.right = cx + w / 2;
}

function canAdvance() {
  if (game.state === 'summary') return game.summaryAge > 0.6;
  return game.state === 'result' || (game.state === 'reveal' && game.reveal.shown && game.reveal.age > 0.6);
}

canvas.addEventListener('pointerdown', e => {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  if (game.drag) return;
  {
    const p = toWorld(e), mw = game.modeWord;                              // the mode word in the header
    if (p.y < 0 && p.y >= -HEADER_H && p.x >= mw.x0 - 12 && p.x <= mw.x1 + 12) { switchMode(); return; }
  }
  if (canAdvance()) {
    const p = toWorld(e);
    if (bankAvailable()) {
      const b = bankPill();
      if (p.x >= b.x - 10 && p.x <= b.x + b.w + 10 && p.y >= b.y - 10 && p.y <= b.y + b.h + 10) { bank(); return; }
    }
    advance(); return;
  }
  if (game.state !== 'observe') return;
  const p = toWorld(e);
  game.drag = { id: e.pointerId, startX: p.x, startY: p.y, startCx: bucketCx(), startW: bucketWidth(), moved: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (game.drag) {
    if (e.pointerId !== game.drag.id) return;
    applyDrag(toWorld(e));
    return;
  }
  if (e.pointerType === 'mouse') {
    canvas.style.cursor = game.state === 'observe' ? 'grab' : (canAdvance() ? 'pointer' : 'default');
  }
});
canvas.addEventListener('pointerup', e => {
  if (!game.drag || e.pointerId !== game.drag.id) return;
  const p = toWorld(e), d = game.drag;
  applyDrag(p);
  game.drag = null;
  canvas.style.cursor = 'default';
  if (!d.moved && !tapDrops(d.startY)) return;                           // a still touch in the top half: nothing happens
  snapBucket();
  commit();
});
canvas.addEventListener('pointercancel', e => {
  if (!game.drag || e.pointerId !== game.drag.id) return;
  game.drag = null; // the gesture was taken over by the browser; do not commit a guess the player did not make
  canvas.style.cursor = 'default';
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && canAdvance()) { e.preventDefault(); advance(); }
});

// ---------------------------------------------------------------- Render
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  view.dpr = dpr; view.cw = cw; view.ch = ch;
  view.scale = Math.min(cw / W, ch / (H + HEADER_H));
  view.ox = (cw - W * view.scale) / 2; view.oy = (ch - (H + HEADER_H) * view.scale) / 2;
}
window.addEventListener('resize', resize);

function ballState() {
  // Returns the ball position and alpha for the current phase, or null when the ball is hidden.
  if (game.state === 'observe') {
    const t = observeT();
    const p = t <= 0 ? { x: game.level.x0, y: START_Y } : posAt(game.level.base, t);
    const alpha = t < game.fadeStartT ? 1 : 1 - (t - game.fadeStartT) / FADE_T;
    return alpha <= 0 ? null : { x: p.x, y: p.y, alpha };
  }
  const r = game.reveal;
  const p = posAt(r.sim, r.simT);
  const alpha = r.startT >= game.fadeStartT ? clamp((r.simT - r.startT) / FADE_T, 0, 1) : 1;
  return { x: p.x, y: p.y, alpha };
}

function drawTrail(sim, t0, t1, alpha, width) {
  const i0 = Math.max(0, Math.floor(t0 / DT)), i1 = Math.min(sim.xs.length - 1, Math.floor(t1 / DT));
  if (i1 - i0 < 2) return;
  ctx.globalAlpha = alpha; ctx.strokeStyle = C.ball; ctx.lineWidth = width;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sim.xs[i0], sim.ys[i0]);
  for (let i = i0 + 2; i <= i1; i += 2) ctx.lineTo(sim.xs[i], sim.ys[i]);
  const p = posAt(sim, t1); ctx.lineTo(p.x, p.y);
  ctx.stroke(); ctx.globalAlpha = 1;
}

function pop(age) { return age < 0.15 ? smooth(age / 0.15) : 1 - 0.7 * smooth((age - 0.15) / 0.45); }
function bump(age) { return age < 0.12 ? smooth(age / 0.12) : 1 - smooth((age - 0.12) / 0.4); }
function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(w, 0), h, r); else ctx.rect(x, y, Math.max(w, 0), h);
}

function draw() {
  const { cw, ch, dpr, scale, ox, oy } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.outside; ctx.fillRect(0, 0, cw, ch);
  ctx.translate(ox, oy); ctx.scale(scale, scale);

  // Column: header band, then the play field below it
  const full = H + HEADER_H;
  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, full);
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0.5, 0); ctx.lineTo(0.5, full); ctx.moveTo(W - 0.5, 0); ctx.lineTo(W - 0.5, full);
  ctx.moveTo(0, full - 0.5); ctx.lineTo(W, full - 0.5);
  ctx.stroke();
  drawHeader();
  ctx.translate(0, HEADER_H);

  if (game.state === 'summary') { drawSummary(); return; }

  // Platforms (drawn fainter in later rounds, never hidden; in endless, later only their endpoints)
  const ps = game.rules;
  ctx.globalAlpha = ps.alpha;
  ctx.strokeStyle = C.platform; ctx.fillStyle = C.platform; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const p of game.level.platforms) {
    if (ps.draw === 'bar') { ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke(); }
    else for (const [x, y] of [[p.x1, p.y1], [p.x2, p.y2]]) { ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  // Trail: the part the player saw stays faint, the revealed part is brighter.
  if (game.state !== 'observe') {
    const r = game.reveal;
    drawTrail(r.sim, 0, r.startT, 0.16, 2);
    drawTrail(r.sim, r.startT, r.simT, 0.45, 2);
  }

  // Bucket
  const b = game.bucket, bottom = RIM_Y + BUCKET_DEPTH, w = bucketWidth(), cx = bucketCx();
  const active = game.state === 'observe';
  ctx.globalAlpha = active ? 1 : 0.75;
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  ctx.fillRect(b.left, RIM_Y, w, BUCKET_DEPTH);
  ctx.strokeStyle = C.bucket; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(b.left, RIM_Y); ctx.lineTo(b.left, bottom); ctx.lineTo(b.right, bottom); ctx.lineTo(b.right, RIM_Y); ctx.stroke();
  ctx.strokeStyle = C.handle; ctx.lineWidth = 4;                       // the centre half of the floor: "dead centre" zone
  ctx.beginPath(); ctx.moveTo(cx - w / 4, bottom); ctx.lineTo(cx + w / 4, bottom); ctx.stroke();
  ctx.globalAlpha = 1;

  // A step that just left the ladder: the old widest bucket collapses into the new widest and fades.
  const g = game.stepGone;
  if (g && g.age < 1 && game.state === 'observe') {
    const gw = lerp(g.from, g.to, smooth(g.age / 0.6)), gx = W / 2;
    ctx.globalAlpha = 0.8 * (1 - smooth((g.age - 0.4) / 0.6));
    ctx.strokeStyle = C.dim; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(gx - gw / 2, RIM_Y); ctx.lineTo(gx - gw / 2, bottom); ctx.lineTo(gx + gw / 2, bottom); ctx.lineTo(gx + gw / 2, RIM_Y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = C.dim; ctx.font = `500 12px ${FONT}`;
    ctx.fillText(`×${g.mult} gone`, gx, bottom + 16);
    ctx.globalAlpha = 1;
  }

  // Multiplier above the bucket. Grows as the bucket narrows; becomes the result at the end.
  const m = multiplier();
  const r = game.reveal, shown = r && r.shown;
  let size = 20 + m * 0.8, color = C.text, word = null, label = '×' + m;
  if (shown) {
    color = C[r.result];
    word = r.result === 'center' ? 'dead centre' : r.result;
    label = r.result === 'miss' ? '0' : '+' + r.score;        // what this round earned, not the bucket's step
    if (r.result === 'center') size *= 1 + (0.15 + 0.5 * (m - 1) / 9) * pop(r.age);   // narrow bucket, big moment; wide bucket, quiet
    else if (r.result === 'edge') size *= 1 + 0.08 * pop(r.age);
    else color = C.miss;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color; ctx.font = `600 ${size.toFixed(1)}px ${FONT}`;
  ctx.globalAlpha = shown && r.result === 'miss' ? 0.55 : 1;
  ctx.fillText(label, cx, RIM_Y - 14);
  ctx.globalAlpha = 1;
  if (word) { ctx.fillStyle = color; ctx.font = `500 12px ${FONT}`; ctx.fillText(word, cx, RIM_Y - 18 - size); }

  // Ball
  const bs = ballState();
  if (bs) {
    ctx.globalAlpha = bs.alpha; ctx.fillStyle = C.ball;
    ctx.beginPath(); ctx.arc(bs.x, bs.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Impact flashes and the result ring
  ctx.lineWidth = 1.5;
  for (const f of game.flashes) {
    const k = f.age / 0.3;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = C.ball;
    ctx.beginPath(); ctx.arc(f.x, f.y, 4 + k * 18, 0, Math.PI * 2); ctx.stroke();
  }
  for (const ring of game.rings) {
    const k = smooth(ring.age / RING_T);
    const big = ring.kind === 'center';
    const rad = big ? (20 + 6 * m) * k : 22 * k;
    ctx.globalAlpha = (big ? 0.35 + 0.06 * m : 0.35) * (1 - ring.age / RING_T);
    ctx.strokeStyle = C[ring.kind]; ctx.lineWidth = big ? 2 : 1.5;
    ctx.beginPath(); ctx.arc(ring.x, ring.y, rad, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Hints: once, at the very first round; then after each round.
  ctx.textAlign = 'center'; ctx.fillStyle = C.dim; ctx.font = `500 13px ${FONT}`;
  if (game.state === 'observe' && game.roundsPlayed === 1 && !game.drag) {
    ctx.fillText('drag sideways to move, up to narrow', W / 2, H - 30);
    ctx.fillText('let go to drop', W / 2, H - 12);
  } else if (canAdvance()) {
    // Where the eye is (PLAN §7.1): mid-field, above the bucket and the ball, semi-transparent.
    // The bottom line went unseen.
    const next = game.session.outcome === 'bust' ? 'tap to finish'
      : game.session.index + 1 >= roundLimit() ? 'tap to finish the session' : 'tap for the next round';
    if (!bankAvailable()) {
      ctx.globalAlpha = 0.6 * clamp((game.reveal.age - 0.6) / 0.3, 0, 1);
      ctx.fillStyle = C.text; ctx.font = `500 16px ${FONT}`;
      ctx.fillText(next, W / 2, RIM_Y - 170);
      ctx.globalAlpha = 1;
    } else {
      // Two ways out, side by side, stated plainly: the next round, or take what is there.
      ctx.textAlign = 'left'; ctx.fillText('tap for the next round', 12, H - 18);
      const p = bankPill();
      ctx.globalAlpha = clamp((game.reveal.age - 0.6) / 0.3, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.04)'; roundedRect(p.x, p.y, p.w, p.h, 13); ctx.fill();
      ctx.strokeStyle = C.dim; ctx.lineWidth = 1; roundedRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1, 12.5); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillStyle = C.text; ctx.font = `600 12px ${FONT}`;
      ctx.fillText(bankLabel(), p.x + p.w / 2, p.y + p.h / 2 + 4);
      ctx.globalAlpha = 1;
    }
  }
}

// Session result: the total and one bar per round. Bar length is the bucket width the player
// chose, a filled bar is a catch (its colour says dead centre or edge), an empty outline is a
// miss. This is the future share card (PLAN §4); for now it only lives on screen.
// Header: session seed (so a session can be reported and replayed), round counter, running
// total, and the strip: five slots, one bar per finished round, so the session takes shape
// while it is played. Bar length is the bucket width, filled = caught, outline = miss.
function drawHeader() {
  const s = game.session, summary = game.state === 'summary';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillStyle = C.faint; ctx.font = `500 14px ${FONT}`;
  ctx.fillText('#' + s.seed, 10, 25);
  const endless = game.mode === 'endless';
  const wordX = 10 + ctx.measureText('#' + s.seed).width + 10;                // the way into the other mode, small, always there
  ctx.fillStyle = C.dim; ctx.font = `500 11px ${FONT}`;
  const word = endless ? 'session' : 'endless';
  ctx.fillText(word, wordX, 25);
  game.modeWord = { x0: wordX, x1: wordX + ctx.measureText(word).width };
  ctx.textAlign = 'center'; ctx.fillStyle = C.dim; ctx.font = `500 14px ${FONT}`;
  ctx.fillText(summary ? game.mode : endless ? `round ${s.index + 1}` : `round ${s.index + 1} / ${SESSION_ROUNDS}`, W / 2, 25);
  ctx.textAlign = 'right'; ctx.fillStyle = C.text;
  ctx.font = `600 ${(20 * (1 + 0.4 * bump(game.totalAge))).toFixed(1)}px ${FONT}`;
  ctx.fillText('×' + s.total, W - 10, 26);
  if (endless && game.best > 0) {                                          // the best total reached on this device
    ctx.fillStyle = C.dim; ctx.font = `500 12px ${FONT}`;
    ctx.fillText('best ' + game.best, W - 10, 46);
  }

  // The strip: the last five rounds. In a long run a new round pushes it one slot to the left.
  const pitch = STRIP_SLOT + STRIP_GAP, span = STRIP_SLOTS * pitch - STRIP_GAP, y = 36, x0 = (W - span) / 2;
  const first = stripFirst(), shift = (1 - smooth(game.stripShiftAge / 0.25)) * pitch;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 1, y - 2, span + 2, STRIP_H + 6); ctx.clip();
  for (let j = shift > 0 ? -1 : 0; j < STRIP_SLOTS; j++) {
    const i = first + j, x = x0 + j * pitch + shift;
    if (i < 0) continue;
    const rd = s.rounds[i], current = !summary && i === s.index;
    ctx.strokeStyle = current ? C.dim : C.line; ctx.lineWidth = 1;          // the slot floor; the current round's is brighter
    ctx.beginPath(); ctx.moveTo(x, y + STRIP_H + 2.5); ctx.lineTo(x + STRIP_SLOT, y + STRIP_H + 2.5); ctx.stroke();
    if (!rd) continue;
    const grow = i === s.rounds.length - 1 ? smooth(game.totalAge / 0.3) : 1;   // the newest bar grows in at the result moment
    const len = rd.width / BUCKET_MAX * STRIP_SLOT * grow;
    if (rd.result === 'miss') { ctx.strokeStyle = C.faint; ctx.lineWidth = 1; roundedRect(x + 0.5, y + 0.5, len - 1, STRIP_H - 1, 2); ctx.stroke(); }
    else { ctx.fillStyle = C[rd.result]; roundedRect(x, y, len, STRIP_H, 2); ctx.fill(); }
  }
  ctx.restore();
}

// Index of the round shown in the strip's first slot: 0 until the run is longer than the strip.
function stripFirst() {
  const s = game.session, last = game.state === 'summary' ? s.rounds.length - 1 : s.index;
  return Math.max(0, last - (STRIP_SLOTS - 1));
}

// Session end: one centred card (PLAN §7.1). The total, big; one bar per round under it;
// "tap anywhere" at its foot. No button: this is the result, not a popup. The endless branch is
// the run-end card; since the band checkpoint (§2e.3) a run has no end inside the game, so that
// branch is never reached. It stays, unchanged, in case a way out returns.
function drawSummary() {
  const s = game.session, age = game.summaryAge;
  ctx.textBaseline = 'alphabetic';
  const endless = game.mode === 'endless', first = endless ? stripFirst() : 0;   // endless: the last five rounds, like the strip
  const cw = 320, chh = 392, cx0 = (W - cw) / 2, cy0 = (H - chh) / 2;
  ctx.globalAlpha = smooth(age / 0.25);
  ctx.fillStyle = 'rgba(255,255,255,0.03)'; roundedRect(cx0, cy0, cw, chh, 16); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; roundedRect(cx0 + 0.5, cy0 + 0.5, cw - 1, chh - 1, 15.5); ctx.stroke();
  ctx.globalAlpha = 1;

  const x0 = cx0 + 56, top = cy0 + 132, rowH = 20, step = 34, scoreX = cx0 + cw - 28;
  for (let j = 0; j < STRIP_SLOTS; j++) {
    const i = first + j, rd = s.rounds[i], y = top + j * step;
    if (!rd) {
      if (endless) continue;                                  // a run has no fixed length: nothing to show as unplayed
      ctx.textAlign = 'right'; ctx.fillStyle = C.line; ctx.font = `500 12px ${FONT}`;   // a session round never played: an empty slot
      ctx.fillText(String(i + 1), x0 - 12, y + rowH / 2 + 4);
      ctx.strokeStyle = C.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y + rowH + 0.5); ctx.lineTo(x0 + 40, y + rowH + 0.5); ctx.stroke();
      continue;
    }
    const k = smooth((age - 0.1 - j * 0.12) / 0.3);          // bars grow in one after another
    if (k <= 0) continue;
    const len = rd.width * k;
    ctx.textAlign = 'right'; ctx.fillStyle = C.faint; ctx.font = `500 12px ${FONT}`;
    ctx.fillText(String(i + 1), x0 - 12, y + rowH / 2 + 4);
    if (rd.result === 'miss') {
      ctx.strokeStyle = C.faint; ctx.lineWidth = 1.5;
      roundedRect(x0, y, len, rowH, 4); ctx.stroke();
    } else {
      ctx.fillStyle = C[rd.result];
      roundedRect(x0, y, len, rowH, 4); ctx.fill();
    }
    if (k >= 1) {
      ctx.textAlign = 'right'; ctx.font = `600 14px ${FONT}`;
      ctx.fillStyle = rd.result === 'miss' || (s.outcome === 'bust' && !endless) ? C.faint : C[rd.result];   // a session bust makes the points history
      ctx.fillText(rd.score ? '×' + rd.score : '0', scoreX, y + rowH / 2 + 5);
    }
  }
  const tk = smooth((age - 0.8) / 0.3);                        // the total lands last
  if (tk > 0) {
    ctx.globalAlpha = tk;
    ctx.textAlign = 'center'; ctx.fillStyle = C.text;
    ctx.font = `700 ${(56 * (0.9 + 0.1 * tk)).toFixed(1)}px ${FONT}`;
    ctx.fillText('×' + (endless ? s.reached : s.total), W / 2, cy0 + 78);
    // How it ended: the same fact the strip shows, in words.
    const how = endless
      ? (s.outcome === 'banked' ? `banked ×${s.reached} · best ${game.best}`
        : game.newBest ? `new best ×${s.reached} in ${s.endedAt} rounds` : `reached ×${s.reached} in ${s.endedAt} rounds · best ${game.best}`)
      : (s.outcome === 'banked' ? `took it after round ${s.endedAt}` : s.outcome === 'bust' ? `lost at round ${s.endedAt}` : 'all five rounds');
    ctx.fillStyle = C.dim; ctx.font = `500 13px ${FONT}`;
    ctx.fillText(how, W / 2, cy0 + 104);
    ctx.globalAlpha = 1;
  }
  if (age > 1.3) {
    ctx.textAlign = 'center'; ctx.fillStyle = C.dim; ctx.font = `500 13px ${FONT}`;
    ctx.fillText('tap anywhere', W / 2, cy0 + chh - 24);
  }
}

// ------------------------------------------------------------------ Loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
game.mode = readMode();
game.best = loadBest();
startSession(readSeed());
requestAnimationFrame(frame);

// Tiny hook for automated checks; not part of the game.
window.__dropgap = {
  game, W, H, RIM_Y, DT, SESSION_ROUNDS, STRIP_SLOTS, MODES, DIFFICULTY, SEEN_AFTER_BOUNCE_MAX, FADE_T, generateLevel, simulate, classify, commit, advance, bank, bankAvailable, bankPill, switchMode, stripFirst, bankLabel, BEST_KEY, ENDLESS_LADDER, ladderRow, rulesFor, bandsFor, fadeStartFor, maxBucketWidth, stepWidth, tapDrops, TAP_DROP_Y, checkpoint, startSession, startRound, roundSeed, scoreFor, multiplier,
  setBucket(left, right) { game.bucket.left = left; game.bucket.right = right; },
};
</script>
</body>
</html>
